<!DOCTYPE html>
  <html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>${title} | GitHub Pages My Demo</title>
    <style>
      *{margin:0;padding:0;box-sizing:border-box;}
      body{font-family:'Segoe UI',system-ui,sans-serif;background:linear-gradient(135deg,#667eea 0%,#764ba2 100%);min-height:100vh;padding:2rem;}
      .container{max-width:900px;margin:0 auto;background:white;border-radius:32px;padding:2rem;box-shadow:0 20px 40px rgba(0,0,0,0.2);}
      h1{color:#4a5568;border-left:4px solid #667eea;padding-left:1rem;margin-bottom:1rem;}
      img{width:100%;border-radius:20px;margin:1rem 0;object-fit:cover;}
      .content{margin:1rem 0;line-height:1.6;color:#2d3748;}
      .info-box{background:#e8f0fe;padding:1rem;border-radius:16px;margin:1rem 0;border-left:4px solid #1a73e8;}
      .back-btn{background:#667eea;color:white;border:none;padding:12px 28px;border-radius:40px;cursor:pointer;font-size:1rem;margin-top:1rem;transition:all 0.2s;}
      .back-btn:hover{background:#5a67d8;transform:translateY(-2px);}
      .footer{text-align:center;margin-top:1rem;font-size:0.8rem;color:#718096;}
    </style>
  </head>
  <body>
    <div class="container">
      <h1>📖 ${title}</h1>
      <img src="${imgUrl}" alt="${title}">
      <div class="info-box">
        <strong>✅ GitHub Pages Demo</strong><br>
        This HTML file is hosted on <strong>GitHub Pages</strong> — which correctly renders HTML!
      </div>
      <div class="content">
        ${content}
        <p style="margin-top:1rem;"><strong>File location:</strong> <code>pages/${filename}</code> in your GitHub repository.</p>
      </div>
      <button class="back-btn" onclick="window.parent.closeHtmlModal()">← Close & Return to Gallery</button>
      <div class="footer">Hosted on GitHub Pages • Free static hosting</div>
    </div>
    <script>
      if(window.parent && window.parent.closeHtmlModal) {
        window.parentClose = window.parent.closeHtmlModal;
      }
    </script>
  </body>
  </html>
